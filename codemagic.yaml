workflows:
  ios-testflight:
    name: Softly and Tender iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      # Replace this with the exact App Store Connect API key name
      # shown in Codemagic Team integrations.
      app_store_connect: YOUR_APP_STORE_CONNECT_KEY_NAME

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.softlyandtender.app
      xcode: latest

    scripts:
      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/SoftlyAndTender.xcodeproj" \
            --scheme "SoftlyAndTender"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
