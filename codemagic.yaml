workflows:
  ios-testflight:
    name: Softly and Tender iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      # App Store Connect API key configured in Codemagic Team integrations
      app_store_connect: ca74f394-6d2b-48a1-a1e0-5134b7117848

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.softlyandtender.app
      xcode: latest

    scripts:
      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/SoftlyAndTender.xcodeproj" \
            --scheme "SoftlyAndTender"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
